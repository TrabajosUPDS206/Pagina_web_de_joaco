<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina Web</title>
</head>
<body>
    <header>
        <h1>Mi pagina web de tecnologia</h1>
        <p>Bienvenidos a mi sitio web.</p>

        <!--Contiene los enlaces para navegar por la pagina-->
        <nav>
            <a href="#inicio">Inicio</a>
            <a href="#informacion">Informacion</a>
            <a href="#contacto">Contacto</a>
        </nav>
    </header>

    <!--Contiene el contenido principal de la pagina-->
    <main>
        <!--Agrupa el contenido de la seccion Inicio-->
        <section id="inicio">
            <h2>Inicio</h2>
            <p>La tecnologia permite desarrollar nuevas herramientas, mejorar la comunicacion y facilitar nuestras actividades.</p>
            <!--Agrupa una imagen con su descripcion-->
            <figure>
                <!--Muestra una imagen y ALT describe la imagen-->
                <img
                    src="https://images.unsplash.com/photo-1518770660439-4636190af475?w=600"
                    alt="Placa electronica con componentes tecnologicos"
                    width="400"
                >

                <!--Agrega una descripcion debajo de la imagen-->
                <figcaption>
                    Componentes electronicos utilizados en el desarrollo de dispositivos tecnologicos.
                </figcaption>
            </figure>
        </section>
</body>
</html>
